[workspace]
members = [
    "crates/geodesic_core",
    "crates/geodesic_io",
    "crates/geodesic_lisp",
    "crates/geodesic_svg",
    "crates/geodesic_cli",
    "crates/geodesic_mcp",
    "crates/geodesic_gui",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
